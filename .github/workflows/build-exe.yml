name: Build Spaceo

on:
  push:
  workflow_dispatch:   # permet aussi de lancer à la main (onglet Actions > Run workflow)

permissions:
  contents: write      # nécessaire pour publier l'exe dans "Releases"

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            exe: Spaceo                # Windows 10 / 11
          - python: "3.8"
            exe: Spaceo-Windows7       # vieux PC : Windows 7 / 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Installer les outils
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter pillow pyinstaller

      - name: Fabriquer l'exe
        run: pyinstaller --onefile --windowed --collect-all customtkinter --name ${{ matrix.exe }} spaceo.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.exe }}
          path: dist/${{ matrix.exe }}.exe

  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: exes
          merge-multiple: true

      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Spaceo (version ${{ github.run_number }})
          files: exes/*.exe